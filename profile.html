<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>RMRP | Профиль</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .profile-box { max-width: 500px; margin: 40px auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px; text-align: center; }
  .avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--accent); color: #000; font-size: 40px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">⚖️ RMRP <span>ФСИН</span></a>
  <nav>
    <a href="index.html">Главная</a>
    <a href="federation-charter.html">Устав УФСИН</a>
    <a href="federation-rules.html">Регламенты и ШИЗО</a>
    <a href="uk.html">УК РФ</a>
    <a href="koap.html">КоАП РФ</a>
    <a href="process.html">Процессуальный</a>
    <a href="audit.html">Калькулятор</a>
    <a href="profile.html" class="active">Профиль</a>
  </nav>
</header>

<div class="container">
  <div class="profile-box" id="authBox">
    <h2>Вход в систему</h2>
    <div class="form-group"><label>Логин</label><input type="text" id="login" placeholder="Ваш логин"></div>
    <div class="form-group"><label>Пароль</label><input type="password" id="pass" placeholder="••••••"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">Войти</button>
    <div style="margin-top:20px"><button class="btn btn-ghost" style="width:100%" onclick="doRegister()">Регистрация</button></div>
  </div>

  <div class="profile-box" id="userBox" hidden>
    <div class="avatar" id="uAvatar">?</div>
    <h2 id="uName">Имя</h2>
    <p style="color:var(--dim); margin-bottom:20px" id="uRank">Звание: Рядовой</p>
    <button class="btn btn-danger" style="width:100%" onclick="doLogout()">Выйти</button>
  </div>
</div>

<script>
  function doLogin() {
    const login = document.getElementById('login').value;
    const pass = document.getElementById('pass').value;
    if (!login || !pass) return alert('Заполните все поля!');
    const user = { login: login, name: login, rank: 'Рядовой' };
    localStorage.setItem('fsin_user', JSON.stringify(user));
    showProfile(user);
  }

  function doRegister() {
    alert('Регистрация пока в разработке (используйте вход).');
  }

  function doLogout() {
    localStorage.removeItem('fsin_user');
    location.reload();
  }

  function showProfile(user) {
    document.getElementById('authBox').hidden = true;
    document.getElementById('userBox').hidden = false;
    document.getElementById('uName').textContent = user.name;
    document.getElementById('uAvatar').textContent = user.name.charAt(0).toUpperCase();
    document.getElementById('uRank').textContent = 'Звание: ' + user.rank;
  }

  const saved = localStorage.getItem('fsin_user');
  if (saved) showProfile(JSON.parse(saved));
</script>
</body>
</html>
